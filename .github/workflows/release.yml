name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Get version from VERSION file
        run: |
          VERSION=$(cat VERSION)
          echo "当前版本号为 ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下文件未格式化:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Build release assets
        if: github.event_name == 'push'
        run: |
          mkdir -p dist

          build() {
            local goos=$1
            local goarch=$2
            local ext=$3
            local name="zerobot-plugin-mcqq_${VERSION}_${goos}_${goarch}"

            echo "Building ${name}${ext}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "dist/${name}${ext}" .
            cp config.example.yml "dist/config.example.yml"

            if [ "$goos" = "windows" ]; then
              (cd dist && zip "${name}.zip" "${name}${ext}" config.example.yml)
            else
              tar -czf "dist/${name}.tar.gz" -C dist "${name}${ext}" config.example.yml
            fi

            rm -f "dist/${name}${ext}" "dist/config.example.yml"
          }

          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"
          build darwin amd64 ""
          build darwin arm64 ""

      - name: Delete existing release
        if: github.event_name == 'push'
        run: gh release delete "v${VERSION}" -R "${{ github.repository }}" -y --cleanup-tag || true

      - name: Create release
        if: github.event_name == 'push'
        run: gh release create "v${VERSION}" dist/* -R "${{ github.repository }}" --generate-notes
